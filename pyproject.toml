[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhdo-server-linker"
version = "0.1.0"
description = "Server-side Linker protocol boundary for authenticated sessions"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["server_linker*"]
